<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevSearch - GitHub Repo Explorer</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔍</text></svg>"
    />
    <!-- our stylesheet -->
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Main app container -->
    <div class="app-container">
      <header class="app-header">
        <h1>DevSearch 🔍</h1>
        <p>Search any GitHub username and explore their public repos</p>
      </header>

      <!-- Search section -->
      <section class="search-section">
        <input
          type="text"
          id="usernameInput"
          placeholder="Enter GitHub username..."
          autocomplete="off"
        />
        <button id="searchBtn">Search</button>
      </section>

      <!-- Loading + error states (hidden by default, JS will toggle these) -->
      <p id="loadingMsg" class="hidden">Loading...</p>
      <p id="errorMsg" class="hidden"></p>

      <!-- Filter/sort controls (only visible once we have results) -->
      <section id="controls" class="controls hidden">
        <label>
          Filter by language:
          <select id="languageFilter">
            <option value="all">All</option>
          </select>
        </label>

        <label>
          Sort by:
          <select id="sortSelect">
            <option value="stars-desc">Stars (high to low)</option>
            <option value="stars-asc">Stars (low to high)</option>
            <option value="name-asc">Name (A-Z)</option>
          </select>
        </label>
      </section>

      <!-- This is where our JS will inject repo cards -->
      <section id="reposContainer" class="repos-container"></section>
    </div>

    <!-- 
    Script loading order matters here:
    utils.js and api.js don't depend on anything,
    render.js depends on utils (for formatting),
    app.js runs last because it USES all the others.
    "defer" makes sure they run after HTML is parsed, in order.
  -->
    <script src="js/utils.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/render.js" defer></script>
    <script src="js/app.js" defer></script>

    <p id="errorMsg" class="hidden"></p>
    <p id="warningMsg" class="hidden"></p>
    <!-- new line -->
  </body>
</html>
